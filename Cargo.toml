[package]
name = "devtoolbox"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.11.1", package = "gtk4", features = ["gnome_50"] }
adw = { version = "0.9.1", package = "libadwaita", features = ["v1_8"] }
sourceview = { version = "0.11.0", package = "sourceview5" }
pastey = "0.2.1"
once_cell = "1.21.3"
regex = "1.12.3"

serde = "1.0.149"
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
toml = "1.1.2"

chrono = "0.4.43"
chrono-tz = "0.10.4"

cron = "0.16.0"

htmlescape = "0.3.1"

base64 = "0.22.1"

pct-str = "3.0.1"

lipsum = "0.9.1"
rand = "0.8.5"   # lipsum depends on rand == "0.8.5"

uuid = { version = "1.23.0", features = [
    "std",
    "rng",
    "v1",
    "v3",
    "v4",
    "v5",
    "v6",
    "v7",
] }
mac_address = "1.1.8"

eff-wordlist = "1.0.3"

palette = "0.7.6"
csscolorparser = "0.8.3"

glycin = { version = "3.1.0", features = ["gdk4"] }
qrcode = "0.14.1"
image = "0.25.10"

color_blinder = "1.0.2"

similar = "3.0.0"

x509-parser = "0.18.1"
sha1 = "0.11.0"
md-5 = "0.11.0"
asn1-rs = "0.7"
