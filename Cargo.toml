[package]
name = "devtoolbox"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.10.3", package = "gtk4", features = ["gnome_49"] }
adw = { version = "0.8.1", package = "libadwaita", features = ["v1_8"] }
sourceview = { version = "0.10.0", package = "sourceview5" }
pastey = "0.2.1"
once_cell = "1.21.3"

serde = "1.0.149"
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
toml = "0.9.8"

chrono = "0.4.43"
chrono-tz = "0.10.4"
